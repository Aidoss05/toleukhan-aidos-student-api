name: toleukhan-aidos-student-api

services:
  postgres:
    image: postgres:16
    container_name: toleukhan-aidos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - toleukhan-aidos-pgdata:/var/lib/postgresql/data
    networks:
      - toleukhan-aidos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: toleukhan-aidos-student-api:${APP_VERSION}
    container_name: toleukhan-aidos-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - toleukhan-aidos-net
    restart: unless-stopped

volumes:
  toleukhan-aidos-pgdata:

networks:
  toleukhan-aidos-net:
